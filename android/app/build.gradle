apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.alexkrewson.argumentmapper"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.alexkrewson.argumentmapper"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file("${keystoreProperties['STORE_FILE']}")
                storePassword keystoreProperties['STORE_PASSWORD']
                keyAlias keystoreProperties['KEY_ALIAS']
                keyPassword keystoreProperties['KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Auto-upload built artifacts to Google Drive via rclone (see
// ../../scripts/upload-apk.mjs). No-ops quietly if rclone or the "gdrive"
// remote isn't set up.
//
// Do NOT go back to iterating t.outputs.files: assemble* are aggregation tasks
// that declare no outputs ("Task has not declared any outputs despite executing
// actions"), so the loop body never ran and the upload silently never happened.
// Scan the real output directory instead.
def uploadArtifacts = { String subdir, String ext ->
    def dir = new File("${buildDir}/outputs/${subdir}")
    if (!dir.isDirectory()) {
        logger.lifecycle("upload-apk: ${dir} does not exist, nothing to upload")
        return
    }
    def found = dir.listFiles()?.findAll { it.isFile() && it.name.endsWith(ext) } ?: []
    if (found.isEmpty()) logger.lifecycle("upload-apk: no ${ext} found in ${dir}")
    found.each { f ->
        exec {
            // node, not bash — bash is absent on Windows, and node is already
            // required to build the web assets.
            commandLine 'node', "${rootProject.projectDir}/../scripts/upload-apk.mjs", f.absolutePath
            ignoreExitValue = true
        }
    }
}

afterEvaluate {
    tasks.findByName('assembleDebug')?.doLast { uploadArtifacts('apk/debug', '.apk') }
    tasks.findByName('assembleRelease')?.doLast { uploadArtifacts('apk/release', '.apk') }
    tasks.findByName('bundleRelease')?.doLast { uploadArtifacts('bundle/release', '.aab') }
}
